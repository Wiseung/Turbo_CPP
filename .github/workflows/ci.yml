name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-windows:
    name: CPU Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DTURBO_CPP_ENABLE_CUDA=OFF

      - name: Build
        run: >
          cmake --build build
          --config Release
          --target turbo_cpp_tests turbo_cpp_bench

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  cpu-linux:
    name: CPU Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        run: >
          cmake -S . -B build
          -G Ninja
          -DTURBO_CPP_ENABLE_CUDA=OFF
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: >
          cmake --build build
          --target turbo_cpp_tests turbo_cpp_bench

      - name: Test
        run: ctest --test-dir build --output-on-failure
